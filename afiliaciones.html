<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiliación - Sociedad Uruguaya de Nefrología</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      margin: 0;
    }

    .form-container {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      overflow: hidden; /* Corta la imagen para adaptarse al borde redondeado del contenedor */
      padding-bottom: 24px;
    }

    /* 🌟 ENCABEZADO CON LA IMAGEN MÉDICA 🌟 */
    .form-header {
      position: relative;
      width: 100%;
      height: 180px;
      background-image: url('img/cientifico.jpg'); /* Asegúrate de que esta sea la ruta de la imagen */
      background-size: cover;
      background-position: center right;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Capa traslúcida azul para mayor legibilidad */
    .form-header::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 32, 96, 0.35);
      z-index: 1;
    }

    .form-header h2 {
      position: relative;
      z-index: 2;
      color: #ffffff;
      margin: 0;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      padding: 0 15px;
    }

    form {
      padding: 10px 0;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
      text-align: left;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
      font-size: 14px;
      color: #333;
    }

    input, textarea, select {
      width: 90%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #3B82F6;
      outline: none;
    }

    button {
      margin-top: 24px;
      width: 90%;
      padding: 12px;
      background: #3B82F6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: block;
      margin-left: auto;
      margin-right: auto;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #2563EB;
    }
  </style>
</head>
<body>

<div class="form-container">
  
  <!-- 📷 ENCABEZADO CON IMAGEN -->
  <div class="form-header">
    <h2>Formulario de Afiliación</h2>
  </div>

  <form action="https://formspree.io/f/tu-id" method="POST">

    <label>Nombre completo</label>
    <input type="text" name="nombre" placeholder="Nombre y apellido" required>

    <label>Cédula de identidad</label>
    <input type="text" name="cedula" placeholder="Ej: 12345678-9" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="correo@ejemplo.com" required>

    <label>Teléfono</label>
    <input type="tel" name="telefono" placeholder="099 123 456">

    <label>Especialidad</label>
    <input type="text" name="especialidad" placeholder="Nefrología u otra" required>

    <label>Lugar de trabajo</label>
    <input type="text" name="institucion" placeholder="Hospital / Clínica">

    <label>Departamento</label>
    <input type="text" name="departamento" placeholder="Montevideo, Canelones, etc.">

    <label>Tipo de afiliación</label>
    <select name="tipo_afiliacion" required>
      <option value="">Seleccionar</option>
      <option value="titular">Titular (Especialista en Nefrología)</option>
      <option value="adherente">Adherente (Médico con otra especialidad)</option>
      <option value="residente">Residente</option>
    </select>

    <label>Comentarios adicionales</label>
    <textarea name="comentarios" rows="4" placeholder="Opcional"></textarea>

    <button type="submit">Enviar solicitud</button>

  </form>
</div>

</body>
</html>
